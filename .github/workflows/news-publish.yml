name: news-publish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news-publish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site files
        run: |
          echo '' | base64 -d > /tmp/nb.tgz
          tar xzf /tmp/nb.tgz
      - name: Commit and remove this one-off workflow
        run: |
          git rm -q .github/workflows/news-publish.yml
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Nelli Updates site"
          git push
