name: news-update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news-update.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site file
        run: |
          echo '' | base64 -d > /tmp/nb2.tgz
          tar xzf /tmp/nb2.tgz
      - name: Commit and remove this one-off workflow
        run: |
          git rm -q .github/workflows/news-update.yml
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Minify site code with brand-named wrapper; keep readable source in src/"
          git push
