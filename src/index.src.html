 return `<div class="sbar${warn?" warn":""}"><span>${h}</span><span>The provider does not say when each score last changed, so a fetch time is not a score time. ${CRED}</span></div>`}
function mrow(m){const c=cls(m);
 return `<div class="mc"><div class="cp"><span>${esc(m.competition)}</span><span class="ls ${c[0]}">${c[1]}</span></div><div class="row"><span>${esc(m.home)}</span><i>${hasSc(m.home_score)?esc(m.home_score):"-"}</i></div><div class="row"><span>${esc(m.away)}</span><i>${hasSc(m.away_score)?esc(m.away_score):"-"}</i></div><div class="nt">${m.time?new Date(m.time).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:true,timeZone:"Asia/Kolkata"})+" IST":""}${m.status=="live"&&m.status_text?" &middot; "+esc(m.status_text):""}${m.url?` &middot; <a href="https://sportscore.com${esc(m.url)}" target="_blank" rel="noopener" style="text-decoration:underline">Details</a>`:""}</div></div>`}
function featured(sp){const o=SC[sp],m=o.data?pick(o.data,sp):null;let body;
 if(!o.okAt)body=`<div class="meta" style="font-size:14px;color:#cfd8f0">${o.busy?"Loading...":"Unavailable: live scores could not be loaded right now."}</div>`;
 else if(!m)body=`<div class="meta" style="font-size:14px;color:#cfd8f0">The SportScore feed currently lists no live ${sp} match. ${(o.data||[]).length>=50?"The feed returned only its first 50 matches of the day, so later and live matches may be missing.":"Other matches may be on that this feed does not cover."}</div>`;
 else{const c=cls(m),ok=hasSc(m.home_score)||hasSc(m.away_score);
  body=`<div class="meta" style="margin:6px 0 0">${esc(m.competition)} &middot; <b>${c[1]}</b></div><div class="row"><span>${esc(m.home)}</span><span class="sc2">${hasSc(m.home_score)?esc(m.home_score):"-"}</span></div><div class="row"><span>${esc(m.away)}</span><span class="sc2">${hasSc(m.away_score)?esc(m.away_score):"-"}</span></div>`+(ok?"":`<div class="meta" style="color:#ffd95a">The provider lists this match as live but has no score for it yet.</div>`)}
 return `<div class="fm"><small>Featured ${sp} &middot; auto-picked: has a score first, then India/Kerala, then major competitions</small>${body}<div class="meta">${o.okAt?`Last successful fetch ${hm(new Date(o.okAt))}${stale(sp)?" - could not refresh, may be out of date":""} &middot; `:""}<a href="#/Scores">All scores</a> &middot; ${CRED}</div></div>`}
function featuredBoth(){return `<div id="fm" class="fmw">${featured("cricket")}${featured("football")}</div>`}
function scoresPage(){const sp=SPORT,o=SC[sp],ms=o.data||[];
 const tabs=`<div class="sw">${Object.keys(SPN).map(k=>`<a href="#/Scores/${k}" class="${k==sp?"on":""}">${SPN[k]}</a>`).join("")}</div>`;
 const part=(t,l)=>l.length?`<div class="sec">${t} (${l.length})</div><div class="mg">${l.map(mrow).join("")}</div>`:"";
 const live=ms.filter(m=>m.status=="live"),up=ms.filter(m=>m.status=="upcoming"),fin=ms.filter(m=>m.status=="finished");
 const nsc=live.filter(m=>hasSc(m.home_score)||hasSc(m.away_score)).length;
 return `<div class="sec">${SPN[sp]} scores</div>${tabs}${status(sp)}${ms.length>=50?`<div class="mu" style="margin:10px 2px">The feed returned only its first 50 matches of the day, earliest first, so later and live matches may be missing.</div>`:""}`+(o.okAt?(live.length?`<div class="mu" style="margin:10px 2px">${live.length} marked live by the provider, ${nsc} with a score.</div>`:"")+(part("Live",live)+part("Upcoming",up)+part("Finished",fin)||`<div class="empty" style="margin-top:14px">The provider returned no ${sp} matches right now.</div>`):`<div class="empty" style="margin-top:14px">${o.busy?"Loading...":"Live scores unavailable right now."}</div>`)}
async function load(sp){const o=SC[sp];
 if(o.busy)return;o.busy=true;const ac=new AbortController(),to=setTimeout(()=>ac.abort(),9000);
 try{const r=await fetch(API(sp),{signal:ac.signal});if(!r.ok)throw new Error("http "+r.status);const j=await r.json();if(!j||!Array.isArray(j.matches))throw new Error("bad data");o.data=j.matches;o.okAt=Date.now();o.err=null}
 catch(e){o.err=String(e&&e.message||e)}
 finally{clearTimeout(to);o.busy=false;paint()}}
function loadAll(){Object.keys(SPN).forEach(load)}
function paint(){const h=decodeURIComponent(location.hash.slice(2)||"Home");const m=$("m");
 if(h.startsWith("Scores")){m.innerHTML=scoresPage()}
 else if(h=="Home"){const f=document.getElementById("fm");if(f)f.outerHTML=featuredBoth()}}
setInterval(()=>{if(!document.hidden){const h=location.hash.slice(2)||"Home";if(h.startsWith("Scores"))load(SPORT);else if(h=="Home")loadAll()}},60000);
function route(){
 let h=decodeURIComponent(location.hash.slice(2)||"Home");const m=$("m");scrollTo(0,0);if(h.startsWith("Scores/")){SPORT=h.split("/")[1]=="football"?"football":"cricket";h="Scores"}
 if(h.startsWith("story/")){const s=S.find(x=>x.id==h.slice(6));if(s){
  document.querySelectorAll("nav a").forEach(a=>a.classList.remove("on"));
  m.innerHTML=`<div class="art"><div style="padding:16px 26px 0"><a class="back" href="#/Home">&larr; Back</a></div>${s.score?vis(s):""}${fig(s)}<div class="bd">${pill(s)}<h1 class="ml">${s.title}</h1><p class="mu">${s.en} &middot; ${s.date}</p>${s.body.map(p=>`<p class="ml">${p}</p>`).join("")}<div class="note">${s.image?s.note.replace(" No photo from the post is shown on this site.",""):s.note}</div><div class="src"><b>Sources</b><br>${s.srcs.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join(" &middot; ")}</div></div></div>`;return}}
 const c=CATS.includes(h)?h:"Home";
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.c==c));
 if(c=="Scores"){m.innerHTML=scoresPage();load(SPORT);return}
 const l=inCat(c);
 if(c=="Home"){const s=S[0];
  m.innerHTML=`<a class="lead" href="#/story/${s.id}">${s.image?fig(s,false):vis(s)}<div class="tx">${pill(s)}<h1 class="ml">${s.title}</h1><p class="mu">${s.en}</p><p class="ml">${s.sum}</p><p class="mu">${s.date} &middot; ${s.cats.find(c=>c!=="Breaking"&&c!=="Highlights")}</p></div></a>${featuredBoth()}${S.length>1?`<div class="sec">Latest</div><div class="grid">${S.slice(1).map(sc).join("")}</div>`:""}<div class="sec">Sections</div><div class="cats">${CATS.slice(1).map(x=>x=="Scores"?`<a class="cat" href="#/Scores">Scores<span>Cricket and football</span></a>`:`<a class="cat" href="#/${x}">${x}<span>${inCat(x).length+autoItems(x).length} ${inCat(x).length+autoItems(x).length==1?"story":"stories"}</span></a>`).join("")}</div>`;loadAll();return}
 const au=autoItems(c);m.innerHTML=`<div class="sec">${c}</div>`+(l.length?`<div class="sec">Nelli Updates stories</div><div class="grid">${l.map(sc).join("")}</div>`:"")+(NEWS?(au.length?autoHtml(c):(!l.length?`<div class="empty">No stories in ${c} yet. Follow <a href="https://www.instagram.com/nelli.updates/" style="text-decoration:underline">@nelli.updates</a> for the latest.</div>`:"")):(!l.length?`<div class="empty">Loading automatic headlines…</div>`:""))}
addEventListener("hashchange",route);
let NEWS=null,NEWSERR=false;
const AMAP={Home:["india"],Kerala:["kerala"],India:["india"],World:["world"],Sports:["sports"],Entertainment:["entertainment"],Tech:["tech"]};
route();
function autoItems(c){const g=AMAP[c];if(!g||!NEWS)return [];const KR=/kerala|kochi|thiruvananthapuram|kozhikode|thrissur|malayalam|kollam|kannur/i;const curated=new Set(inCat(c).flatMap(s=>[s.en,s.title]).map(titleKey));return g.flatMap(k=>(NEWS.groups[k]||[]).filter(a=>k!="kerala"||KR.test(a.title+" "+a.description))).filter(a=>!curated.has(titleKey(a.title))).slice(0,c=="Home"?6:8)}
function autoHtml(c){const l=autoItems(c);if(!l.length)return "";
 return `<div class="ah"><div class="sec">Automatic headlines</div><div class="al">${l.map(a=>`<a class="ai" href="${esc(a.link)}" target="_blank" rel="noopener nofollow"><b>${esc(a.title)}</b>${a.description?`<p>${esc(a.description)}</p>`:""}<span>${esc(a.source)}${a.pubDate?" &middot; "+esc(a.pubDate)+" UTC":""} &middot; opens publisher</span></a>`).join("")}</div><div class="nt">Automatic headlines from linked publishers, about 12 hours behind live, fetched about once an hour (last fetch: ${esc(NEWS.fetched_at)}${NCHK?"; checked at "+hm(NCHK):""}). Published times are UTC. The page re-checks every 5 minutes while open; nothing is pushed to your phone. Data: <a href="https://newsdata.io/" target="_blank" rel="noopener">NewsData.io</a>. Not edited by Nelli Updates.</div></div>`}
function addAuto(){const h=decodeURIComponent(location.hash.slice(2)||"Home");const c=CATS.includes(h)?h:(h==""?"Home":null);if(!c||c=="Scores"||c=="Breaking"||c=="Highlights")return;const m=$("m");const old=m.querySelector(".ah");if(old)old.remove();const x=autoHtml(c);if(x){const empty=m.querySelector(".empty");if(empty)empty.remove();m.insertAdjacentHTML("beforeend",x)}else if((NEWS||NEWSERR)&&!inCat(c).length&&!m.querySelector(".empty"))m.insertAdjacentHTML("beforeend",`<div class="empty">${NEWSERR&&!NEWS?"Automatic headlines are unavailable right now.":`No stories in ${c} yet. Follow <a href="https://www.instagram.com/nelli.updates/" style="text-decoration:underline">@nelli.updates</a> for the latest.`}</div>`);if(c=="Home")m.querySelectorAll(".cats .cat").forEach(a=>{const name=decodeURIComponent(a.getAttribute("href").slice(2));if(name=="Scores")return;const n=inCat(name).length+autoItems(name).length;const span=a.querySelector("span");if(span)span.textContent=`${n} ${n==1?"story":"stories"}`})}
let NCHK=null;function loadNews(){fetch("news.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j&&j.groups){NEWS=j;NCHK=new Date();NEWSERR=false;addAuto()}}).catch(()=>{NEWSERR=true;addAuto()})}

let SDYN="";function loadStories(){fetch("stories.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(!j||!Array.isArray(j.stories))return;
 const ids=new Set(S.filter(x=>!x.dyn).map(x=>x.id));const gone=new Set(Array.isArray(j.removed)?j.removed:[]);const dyn=j.stories.filter(x=>x&&typeof x.id=="string"&&!ids.has(x.id)&&!gone.has(x.id)&&Array.isArray(x.body)&&Array.isArray(x.srcs)).map(x=>{const e={dyn:1,id:esc(x.id),cats:(x.cats||[]).map(esc),title:esc(x.title),en:esc(x.en),sum:esc(x.sum),date:esc(x.date),body:x.body.map(esc),note:esc(x.note),srcs:x.srcs.filter(z=>z&&String(z[1]).startsWith("https://")).map(z=>[esc(z[0]),esc(z[1])])};
  if(x.image&&typeof x.image.file=="string"&&/^images\/[a-z0-9._-]+\.(jpg|jpeg|png)$/.test(x.image.file)&&(String(x.image.page).startsWith("https://commons.wikimedia.org/wiki/")||String(x.image.page)=="https://www.nasa.gov/image-article/latest-rs-25-engine-test-in-support-of-future-artemis-missions/"||String(x.image.page)=="https://www.nature.com/articles/s41467-019-11357-9/figures/1"))e.image={file:esc(x.image.file),alt:esc(x.image.alt),label:esc(x.image.label),credit:esc(x.image.credit),license:esc(x.image.license),page:esc(x.image.page)};if(x.score)e.score={l1:esc(x.score.l1),n:esc(x.score.n),b:esc(x.score.b),st:(x.score.st||[]).map(esc),ft:esc(x.score.ft)};return e});
 const sig=dyn.map(x=>x.id+(x.image?"i":"")+x.title).join(",");if(sig===SDYN)return;SDYN=sig;
 for(let i=S.length-1;i>=0;i--)if(S[i].dyn)S.splice(i,1);S.unshift(...dyn);
 const h=decodeURIComponent(location.hash.slice(2)||"Home");if(h=="Home"||h.startsWith("story/")||CATS.includes(h)&&h!="Scores"){route();addAuto()}}).catch(()=>{})}
loadStories();setInterval(()=>{if(!document.hidden)loadStories()},300000);
loadNews();setInterval(()=>{if(!document.hidden)loadNews()},300000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadNews()});
addEventListener("hashchange",()=>setTimeout(addAuto,0));

</script></body></html>
